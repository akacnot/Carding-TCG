<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardin TCG 会員証</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f0f2f5;
}

.card{
    max-width:400px;
    margin:30px auto;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
    text-align:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#0066cc;
}

.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:15px 0;
}

.name{
    font-size:24px;
    font-weight:bold;
}

.member{
    margin-top:15px;
    font-size:18px;
}

.point{
    margin-top:10px;
    font-size:22px;
    color:#ff6600;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">Cardin TCG</div>

<img id="icon" class="profile">

<div id="name" class="name">読み込み中...</div>

<div class="member">
会員番号：000001
</div>

<div class="point">
100P
</div>

</div>

<script>

async function main(){

    await liff.init({
        liffId: "2010457116-yVCDEr78"
    });

    if(!liff.isLoggedIn()){
        liff.login();
        return;
    }

    const profile = await liff.getProfile();

    document.getElementById("name").innerText =
        profile.displayName;

    document.getElementById("icon").src =
        profile.pictureUrl;
}

main();

</script>

</body>
</html>
